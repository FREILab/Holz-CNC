##############################################################################
# X-Carve 1000mm  (Inventables)  —  PiBot V5.88 Ultra  —  FluidNC
#
# Axes:    XYYZ (dual-motor Y)
# Drivers: 4x PiBot SilentStep TMC5160 V5, SPI independent (per-axis CS)
# Spindle: router switched on/off by a relay on GPIO.46 (M3/M5, no speed)
# Homing:  limit switches — X/Y to -X/-Y (front-left), Z up to +Z (top)
#
# Wiring assumptions (verify against your machine before first $H):
#   Limit inputs (PiBot opto-isolated terminals, active-low `:low`):
#     X  -> gpio.42
#     Y1 -> gpio.40
#     Y2 -> gpio.39  (used as the 2nd Y rail for auto-squaring)
#     Z  -> gpio.38  (used as the +Z top switch)
#   Probe (3D touch) -> gpio.41   Toolsetter -> gpio.37
#   Toolsetter overtravel -> gpio.36 (NC to GND; opens on overtravel -> trips a
#     latched critical alarm via control.fault_pin, same reset UX as a hard limit)
#
# TMC5160 notes:
#   * SilentStep TMC5160 V5 uses 0.1 ohm sense resistors (r_sense_ohms: 0.1).
#   * run_amps 2.8 A / hold_amps 1.4 A — set run_amps to YOUR motor rating.
#   * Independent SPI (spi_index: -1): shared MOSI/SCK/MISO, one cs_pin per driver.
#     CS lines: X=I2SO.3 (SPI header), Y1=I2SO.6, Y2=I2SO.11, Z=I2SO.14 (the
#     StepStick sockets' MS3 pins). The 3-jumper SPI block (item 16) is NOT used.
#   * use_enable: false keeps motors held (Z won't drop) — see notes at bottom.
##############################################################################

board: PiBot V588
name: X-Carve 1000mm (PiBot V5.88 Ultra)
meta: XYYZ + TMC5160 V5 SPI independent

stepping:
  engine: I2S_STATIC
  idle_ms: 254
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

spi:
  miso_pin: gpio.2
  mosi_pin: gpio.1
  sck_pin: gpio.21

i2so:
  bck_pin: gpio.16
  data_pin: gpio.17
  ws_pin: gpio.18

# NOTE: no i2c0:/oled: here — FluidNC >= 4.0.4 ships ESP32-S3 builds with the
# OLED module excluded (platformio.ini [common_esp32s3]: "-<../esp32/OLED.cpp>",
# bdring/FluidNC#1804), so any oled: key is rejected with "Ignored key oled".
# Re-add i2c0: + oled: only with a self-built wifi_s3 firmware where that line
# is commented out.

sdcard:
  card_detect_pin: NO_PIN
  cs_pin: gpio.9

axes:
  shared_stepper_disable_pin: NO_PIN

  x:
    # 16x microstepping (GT2 20t = 40mm/rev)
    steps_per_mm: 53.333
    max_rate_mm_per_min: 10000.000
    acceleration_mm_per_sec2: 300.000
    max_travel_mm: 760.000
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 200.000
      seek_mm_per_min: 4000.000
      settle_ms: 350
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: gpio.42:low
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 1.800
      tmc_5160:
        step_pin: I2SO.2
        direction_pin: I2SO.1:low
        disable_pin: I2SO.0
        cs_pin: I2SO.3
        spi_index: -1
        r_sense_ohms: 0.1
        run_amps: 2.8
        hold_amps: 1.4
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false

  y:
    # 16x microstepping
    steps_per_mm: 53.333
    max_rate_mm_per_min: 10000.000
    acceleration_mm_per_sec2: 300.000
    max_travel_mm: 940.000
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 200.000
      seek_mm_per_min: 4000.000
      settle_ms: 350
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: gpio.40:low
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 1.800
      tmc_5160:
        step_pin: I2SO.5
        direction_pin: I2SO.4:low
        disable_pin: I2SO.7
        cs_pin: I2SO.6
        spi_index: -1
        r_sense_ohms: 0.1
        run_amps: 2.8
        hold_amps: 1.4
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
    motor1:
      limit_neg_pin: gpio.39:low
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 1.500
      tmc_5160:
        step_pin: I2SO.10
        direction_pin: I2SO.9:low
        disable_pin: I2SO.8
        cs_pin: I2SO.11
        spi_index: -1
        r_sense_ohms: 0.1
        run_amps: 2.8
        hold_amps: 1.4
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false

  z:
    # 16x microstepping
    steps_per_mm: 408.000
    max_rate_mm_per_min: 1500.000 
    #2200 seems possible, but you know
    acceleration_mm_per_sec2: 150.000
    max_travel_mm: 156.000
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 156.000
      feed_mm_per_min: 150.000
      seek_mm_per_min: 500.000
      settle_ms: 350
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: gpio.38:low
      limit_all_pin: NO_PIN
      hard_limits: true
      pulloff_mm: 3.000
      tmc_5160:
        step_pin: I2SO.13
        direction_pin: I2SO.12
        disable_pin: I2SO.15
        cs_pin: I2SO.14
        spi_index: -1
        r_sense_ohms: 0.1
        run_amps: 2.8
        hold_amps: 1.4
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false

Relay:
  output_pin: gpio.46
  enable_pin: NO_PIN
  direction_pin: NO_PIN
  disable_with_s0: true
  s0_with_disable: true
  spinup_ms: 0
  spindown_ms: 0
  tool_num: 0
  speed_map: 0=0.000% 1000=100.000%
  off_on_alarm: true

start:
  must_home: false
