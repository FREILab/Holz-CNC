# Begin PWM  
pwm:
  pwm_hz: 5000
#   direction_pin: NO_PIN
  output_pin: gpio.45
  enable_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true
#   spinup_ms: 0
#   spindown_ms: 0
  tool_num: 0
  speed_map: 0=0.000% 10000=100.000%
  off_on_alarm: false
 
# Begin Laser 
Laser:
  pwm_hz: 5000
  output_pin: gpio.46
  enable_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true
  tool_num: 1
  speed_map: 0=0.000% 255=100.000%
  off_on_alarm: true

## Start 0-10V
10V:
  forward_pin: gpio.7
  reverse_pin: gpio.8
  pwm_hz: 5000
  output_pin: gpio.6
  enable_pin: NO_PIN
  direction_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: true
  spinup_ms: 0
  spindown_ms: 0
  tool_num: 2
  speed_map: 0=0.000% 1000=0.000% 24000=100.000%
  off_on_alarm: false

## Start only for test the RS485chip communication
uart1:
  txd_pin: gpio.12
  rxd_pin: gpio.11
  rts_pin: NO_PIN
  baud: 9600
  mode: 8N1

ModbusVFD:
  uart_num: 1
  modbus_id: 1
  debug: 0
  poll_ms: 250
  retries: 5
  spinup_ms: 6000
  spindown_ms: 6000
  tool_num: 3
  speed_map: 0=0.00% 24000=100.00%
  off_on_alarm: false
  atc:
  m6_macro:
  s0_with_disable: false
  disable_with_s0: false
  model: Huanyang
  min_RPM: 6000
  max_RPM: 24000
  cw_cmd: 03 01 01 > echo
  ccw_cmd: 03 01 11 > echo
  off_cmd: 03 01 08 > echo
  set_rpm_cmd: 05 02 rpm*100/60 > echo
  get_min_rpm_cmd: 01 03 0b 00 00 > 01 03 0B minRPM*60/100
  get_max_rpm_cmd: 01 03 05 00 00 > 01 03 05 maxRPM*60/100
  get_rpm_cmd: 04 03 01 00 00 > 04 03 01 rpm*60/100
  