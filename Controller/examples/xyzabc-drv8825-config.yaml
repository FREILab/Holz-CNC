##############################################################################
## THIS EXAMLE ONLY FOR IOTEST, DO NOT USE FOR YOUR MACHINE BEFORE MODIFY  ##########
#############################################################################

board: PiBot V588
name:  PiBot V588 IO Test YAML

stepping:
  engine: I2S_STATIC
  idle_ms: 254
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

###################################START TEST UART###################################
## uart0 main usb port
## uart1 RS485 tx rx
## uart2 RJ12 TX rx
## uart3 second usb port
#####################################################################################


## Begin expansion port uart and channel setup (test the rj12 port)
uart2:
  txd_pin: gpio.0
  rxd_pin: gpio.35
  baud: 1000000
  mode: 8N1

uart_channel2:
  report_interval_ms: 75
  uart_num: 2
## End expansion port set up.

## Start USB-HOST FIRST TIME NEED SET $USBCDC/Enable=Off (test the second usb port)
#uart3:
#  usb_host:
#    baud: 115200
# the baud almost=115200

#uart_channel3:
#  report_interval_ms: 0
#  uart_num: 3
#  message_level: Verbose
## Start USB-HOST

###################################END TEST UART####################################

spi:
  miso_pin: gpio.2
  mosi_pin: gpio.1
  sck_pin: gpio.21

sdcard:
  card_detect_pin: NO_PIN
  cs_pin: gpio.9

i2so:
  bck_pin: gpio.16
  data_pin: gpio.17
  ws_pin: gpio.18

## Begin OLED
i2c0:
   scl_pin: gpio.13
   sda_pin: gpio.14

oled:
   i2c_num: 0
   i2c_address: 60
   width: 128
   height: 64
   radio_delay_ms: 1000
## END OLED

probe:
  pin: gpio.47:low
  toolsetter_pin: gpio.3:low
  check_mode_start: true
  hard_stop: false

coolant:
  mist_pin: gpio.4
  flood_pin: gpio.5

user_outputs:
  digital0_pin: gpio.10
  digital1_pin: gpio.15
##M64 P0 / on --  M65 P0 / off // M64 P1 on --  M65 P1 off
  
start:
  must_home: false

axes:
  shared_stepper_disable_pin: NO_PIN
  x:
    steps_per_mm: 800.000
    max_rate_mm_per_min: 5000.000
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 300.000
    soft_limits: false
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 150.000
      feed_mm_per_min: 100.000
      seek_mm_per_min: 200.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100

    motor0:
      limit_neg_pin: gpio.42:low
      limit_pos_pin: gpio.41:low
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      standard_stepper:
        step_pin: I2SO.2
        direction_pin: I2SO.1
        disable_pin: I2SO.0

