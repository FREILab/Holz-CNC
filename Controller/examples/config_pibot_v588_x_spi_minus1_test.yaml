##############################################################################
# PiBot V5.88 Ultra - FluidNC
# X SPI bring-up test - SINGLE DRIVER, independent mode (spi_index: -1)
#
# Use this to isolate the X TMC5160 before wiring the daisy chain.
#   * spi_index: -1  -> independent mode (one CS, one driver on the SPI bus)
#   * cs_pin only on X (I2SO.3)
#   * r_sense_ohms: 0.1  (PiBot SilentStep TMC5160 V5 = 0.1 ohm sense)
#
# Procedure:
#   1. Flash this config.
#   2. Verify SPI first - send $MI. X must appear with sensible values.
#      If it does not, stop: fix jumpers/wiring before jogging (3.3V logic,
#      SD_MODE=1 + SPI_MODE=1, 24V present, common GND).
#   3. Jog X slowly ($J=X10F500). Raise run_amps if it stalls.
##############################################################################

board: PiBot V588
name: PiBot V588 X SPI Test (-1)

stepping:
  engine: I2S_STATIC
  idle_ms: 254
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

spi:
  miso_pin: gpio.2
  mosi_pin: gpio.1
  sck_pin: gpio.21

i2so:
  bck_pin: gpio.16
  data_pin: gpio.17
  ws_pin: gpio.18

sdcard:
  card_detect_pin: NO_PIN
  cs_pin: gpio.9

start:
  must_home: false

axes:
  shared_stepper_disable_pin: NO_PIN

  x:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 2000.000
    acceleration_mm_per_sec2: 100.000
    max_travel_mm: 770.000
    soft_limits: false
    homing:
      cycle: 0
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 25.000
      seek_mm_per_min: 800.000
      settle_ms: 250
      seek_scaler: 1.100
      feed_scaler: 1.100
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      tmc_5160:
        step_pin: I2SO.2
        direction_pin: I2SO.1
        disable_pin: I2SO.0
        cs_pin: I2SO.3
        spi_index: -1
        r_sense_ohms: 0.1
        run_amps: 1.5
        hold_amps: 0.75
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        use_enable: false
